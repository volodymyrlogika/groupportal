{% extends 'base.html' %}

{% block title %}Додати оцінку{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Виставити нову оцінку</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="id_student" class="form-label fw-bold">Студент/Учень</label>
                    {{ form.student }}
                </div>

                <div class="mb-3">
                    <label for="id_lesson" class="form-label fw-bold">Урок/Заняття</label>
                    {{ form.lesson }}
                </div>

                <div class="mb-3">
                    <label for="id_grade_type" class="form-label fw-bold">Тип оцінювання</label>
                    {{ form.grade_type }}
                </div>

                <div class="mb-3">
                    <label for="id_value" class="form-label fw-bold">Оцінка (1-12)</label>
                    {{ form.value }}
                </div>

                <div class="mb-3">
                    <label for="id_comment" class="form-label fw-bold">Коментар</label>
                    {{ form.comment }}
                </div>

                <div class="d-flex justify-content-between pt-3">
                    <a href="{% url 'journal:all_grades' %}" class="btn btn-secondary">Скасувати</a>
                    <button type="submit" class="btn btn-success">Зберегти оцінку</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Додаємо Bootstrap-класи до полів форми для гарного вигляду
    document.querySelectorAll('input, select, textarea').forEach(el => {
        el.classList.add('form-control');
    });
</script>
{% endblock %}
