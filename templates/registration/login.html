<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — Logika School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f5f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            padding: 30px;
        }
    </style>
</head>
<body>

<div class="login-card text-center">
    <h3 class="fw-bold mb-1 text-primary">Logika School</h3>
    <p class="text-muted small mb-4">Авторизуйтесь для доступу до щоденника</p>

    {% if form.errors %}
        <div class="alert alert-danger p-2 small">Невірний логін або пароль</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3 text-start">
            <label class="form-label small fw-bold text-secondary">Логін</label>
            <input type="text" name="username" class="form-control rounded-3" required>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label small fw-bold text-secondary">Пароль</label>
            <input type="password" name="password" class="form-control rounded-3" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 rounded-3 py-2 fw-bold">Увійти</button>
    </form>
</div>

</body>
</html>
