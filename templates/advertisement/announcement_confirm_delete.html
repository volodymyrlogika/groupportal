{% extends 'base.html' %}

{% block title %}Видалення оголошення — Портал групи{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-danger text-white py-3">
                <h5 class="m-0 fw-bold">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>Підтвердження видалення
                </h5>
            </div>
            <div class="card-body p-4 text-center">
                <p class="fs-5 mb-4">
                    Ви дійсно бажаєте видалити оголошення <br>
                    <strong class="text-dark">"{{ object.title }}"</strong>?
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'advertisement:list' %}" class="btn btn-outline-secondary px-4">
                            Скасувати
                        </a>
                        <button type="submit" class="btn btn-danger fw-bold px-4">
                            Видалити
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
