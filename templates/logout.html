{% extends 'base.html' %}

{% block title %}Ви вийшли - GroupPortal{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 60vh;">
    <div style="text-align: center;">
        <div style="font-size: 4rem; margin-bottom: 24px;">
            <i class="fas fa-sign-out-alt" style="color: var(--primary);"></i>
        </div>
        
        <h1 style="margin-bottom: 16px;">До побачення!</h1>
        <p style="font-size: 1.1rem; color: var(--gray-600); margin-bottom: 32px;">
            Ви успішно вийшли з профілю. До зустрічі в GroupPortal!
        </p>
        
        <div style="display: flex; gap: 16px; justify-content: center;">
            <a href="{% url 'topic_list' %}" class="btn btn-primary">
                <i class="fas fa-home"></i> На головну
            </a>
            <a href="{% url 'login' %}" class="btn btn-secondary">
                <i class="fas fa-sign-in-alt"></i> Увійти знову
            </a>
        </div>
    </div>
</div>
{% endblock %}
