{% extends 'base.html' %}

{% block title %}Редагувати пост - GroupPortal{% endblock %}

{% block content %}
<div style="max-width: 760px; margin: 0 auto;">
    <div style="margin-bottom: 24px;">
        <a href="{% url 'topic_chat' post.topic.id %}" class="text-primary" style="text-decoration: none;">
            <i class="fas fa-arrow-left"></i> Назад до теми
        </a>
        <h1 style="margin-top: 12px;">Редагувати пост</h1>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.non_field_errors }}
                <div class="form-group">
                    <label for="{{ form.content.id_for_label }}" class="form-label">Текст</label>
                    {{ form.content }}
                    {{ form.content.errors }}
                </div>
                <div class="form-group">
                    <label for="{{ form.image.id_for_label }}" class="form-label">
                        <i class="fas fa-image"></i> Зображення
                    </label>
                    {{ form.image }}
                    {{ form.image.errors }}
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Зберегти зміни
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
