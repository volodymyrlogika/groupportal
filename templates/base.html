<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GroupPortal - Спільнота{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

{% include 'menu.html' %}

<main>
    <div class="container-custom">
        {% block content %}
        {% endblock %}
    </div>
</main>

<footer style="background: linear-gradient(135deg, #1f2937 0%, #2563eb 50%, #7c3aed 100%); color: white; text-align: center; padding: 32px 16px; margin-top: 64px;">
    <div style="max-width: 1200px; margin: 0 auto;">
        <p style="margin: 0; font-size: 0.95rem;">© 2026 <strong>GroupPortal</strong> - Спільнота для спілкування</p>
        <p style="margin: 8px 0 0 0; color: rgba(255,255,255,0.8); font-size: 0.85rem;">Поєднуємо людей, розбудовуємо спільноти</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
